services:
  - type: web
    name: easyride
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_PATH
        value: /data/database.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: REVIEW_KEY
        generateValue: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
